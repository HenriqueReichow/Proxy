<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel de Testes do Proxy</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #1e1e1e; color: #fff; text-align: center; padding: 30px; }
        .container { max-width: 800px; margin: auto; }
        h1 { color: #4CAF50; }
        .botoes { margin: 20px 0; display: flex; justify-content: center; gap: 15px; }
        .btn { border: none; color: white; padding: 15px 25px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        /* Cores dos métodos (Padrão de APIs) */
        .btn-get { background: #61affe; } .btn-get:hover { background: #2b8dfa; }
        .btn-post { background: #49cc90; } .btn-post:hover { background: #26a567; }
        .btn-put { background: #fca130; } .btn-put:hover { background: #e08204; }
        .btn-patch { background: #50e3c2; } .btn-patch:hover { background: #1eb996; }
        .btn-del { background: #f93e3e; } .btn-del:hover { background: #e31b1b; }

        #terminal { background: #000; border-left: 5px solid #4CAF50; padding: 20px; text-align: left; height: 350px; overflow-y: auto; color: #00ff00; font-family: 'Courier New', Courier, monospace; border-radius: 5px; box-shadow: inset 0 0 10px rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Painel de Disparo - Proxy HTTP</h1>
        <p>Clique nos botões para enviar requisições ao <b>httpbin.org</b> através do proxy.</p>
        
        <div class="botoes">
            <button class="btn btn-get" onclick="disparar('GET')">GET</button>
            <button class="btn btn-post" onclick="disparar('POST')">POST</button>
            <button class="btn btn-put" onclick="disparar('PUT')">PUT</button>
            <button class="btn btn-patch" onclick="disparar('PATCH')">PATCH</button>
            <button class="btn btn-del" onclick="disparar('DELETE')">DELETE</button>
        </div>

        <div id="terminal">// Aguardando comandos...</div>
    </div>

    <script>
        async function disparar(metodo) {
            const terminal = document.getElementById('terminal');
            terminal.innerText = `[${new Date().toLocaleTimeString()}] Inicializando requisição ${metodo}...\n`;
            
            // O httpbin tem uma URL específica para cada método
            const url = `http://httpbin.org/${metodo.toLowerCase()}`;
            
            const options = {
                method: metodo,
                headers: { 'Content-Type': 'application/json' }
            };

            // GET e DELETE não levam corpo (body), os outros sim.
            if (metodo !== 'GET' && metodo !== 'DELETE') {
                options.body = JSON.stringify({ 
                    usuario: "Luis", 
                    status: "Testando envio de payload pelo proxy",
                    timestamp: Date.now()
                });
            }

            try {
                // O fetch no navegador automaticamente passa pelo proxy se o sistema estiver configurado!
                const response = await fetch(url, options);
                const data = await response.json();
                
                terminal.innerText += `[STATUS]: ${response.status} OK\n`;
                terminal.innerText += `[DESTINO]: ${url}\n\n`;
                terminal.innerText += `[RESPOSTA DO SERVIDOR]:\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                terminal.innerText += `\n[ERRO FATAL]: ${error.message}\nVerifique se o seu proxy Flask está rodando e configurado no navegador!`;
            }
        }
    </script>
</body>
</html>
